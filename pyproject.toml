[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memcore-sleep-os"
version = "1.0.0"
description = "MemCore — Self-Evolving Continual Memory & Sleep-Time Compute OS"
authors = [{ name = "MemCore Core Team" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "celery>=5.3.6",
    "redis>=5.0.0",
    "fakeredis>=2.21.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.5",
    "litellm>=1.30.0",
    "groq>=0.5.0",
    "openai>=1.14.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "tiktoken>=0.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
