version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memcore-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memcore}
      POSTGRES_USER: ${POSTGRES_USER:-memcore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memcore_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memcore_user} -d ${POSTGRES_DB:-memcore}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: memcore-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memcore-api
    restart: always
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-memcore_user}:${POSTGRES_PASSWORD:-memcore_secret}@postgres:5432/${POSTGRES_DB:-memcore}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_DIM=384
      - FAST_PATH_TOKEN_BUDGET=2000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memcore-celery-worker
    restart: always
    command: ["celery", "-A", "src.sleep_engine.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "memcore_sleep_queue", "-c", "2"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-memcore_user}:${POSTGRES_PASSWORD:-memcore_secret}@postgres:5432/${POSTGRES_DB:-memcore}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_DIM=384
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
  redisdata:
